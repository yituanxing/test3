<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZD Demo · 登录</title><style>*{box-sizing:border-box}body{font-family:system-ui,"Microsoft Yahei",sans-serif;background:#eef3fb;color:#152238;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;border-radius:16px;box-shadow:0 10px 40px #183a611b;padding:32px;max-width:430px;width:95%}h1{font-size:23px}input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #cbd5e1;font-size:16px}button{background:#185acc;color:white;border:0;cursor:pointer}small{color:#5c6b83}#msg{color:#b91c1c;min-height:22px}</style></head><body><main><h1>ZD 场所预警分析</h1><p>四级辖区账号登录 · V1.2 内部演示</p><form id="auth"><input name="username" aria-label="用户名" autocomplete="username" placeholder="用户名" required/><input name="password" type="password" aria-label="密码" autocomplete="current-password" placeholder="密码" required/><button type="submit">登录</button><div id="msg" role="alert"></div></form><small>账户由本机管理员使用 bootstrap_roles.py 创建。人员与轨迹均为合成演示数据。请勿将本系统直接暴露到公网。</small></main><script>
const form=document.querySelector('#auth'),msg=document.querySelector('#msg');
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const values=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});const data=await r.json();if(!r.ok)throw Error(data.detail||'登录失败');sessionStorage.setItem('zd_access_token',data.access_token);location.assign('/admin')}catch(e){msg.textContent=e.message}});
</script></body></html>
