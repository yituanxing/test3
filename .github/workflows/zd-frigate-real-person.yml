name: ZD Frigate Real Person CI

"on":
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "static/**"
      # GB protocol/test harness edits must NOT silently miss PR acceptance.
      # The expensive gb-sip-protocol job remains opt-in via gb-e2e label.
      - "scripts/ci_verify_gb28181_sip.sh"
      - "scripts/verify_gb28181_real_app.py"
      - "scripts/package_local_demo.py"
      - "scripts/verify_caviar_public_footage.py"
      - "scripts/verify_epfl_alternative_cameras.py"
      - "scripts/verify_epfl_six_person_ground_truth.py"
      - "scripts/browser_epfl_six_person_review.py"
      - "scripts/assess_real_person_readiness.py"
      - "requirements-tracking.txt"
      - "requirements-person-detection.txt"
      - ".github/workflows/zd-frigate-real-person.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: zd-frigate-real-person-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge commit + its head commit + previous head commit.
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-business.txt
      # Fast feedback by default. Full expensive CAVIAR/EPFL is automatic
      # when its owner inputs change, or opt-in with [cctv-full] on a commit.
      # PR checkout is a merge commit (HEAD^1 = PR base); fail closed to
      # full testing if the merge/base cannot be inspected.
      - name: Classify changed paths for targeted media validation
        id: media_scope
        shell: bash
        run: |
          set -euo pipefail
          run_full=false
          # The merge-base diff includes ALL historical PR changes, forcing
          # repeated downloads forever. Compare only the latest PR head
          # commit instead. The final [cctv-full] run rechecks everything.
          if ! git rev-parse 'HEAD^2^' >/dev/null 2>&1; then
            run_full=true
          else
            git diff --name-only 'HEAD^2^' 'HEAD^2' > /tmp/zd_changed_files
            cat /tmp/zd_changed_files
            # Only owner input/output changes require expensive real footage
            # downloads and pretrained model dependencies.
            if grep -Eq '^(app/(cctv_dataset|epfl_review|occurrences|research_linkage|site_model)\.py|scripts/(verify_caviar_public_footage|verify_epfl_six_person_ground_truth|verify_epfl_alternative_cameras|browser_epfl_six_person_review|assess_real_person_readiness)\.py|tests/(test_cctv_dataset|test_epfl_six_person_geometry|test_epfl_review)\.py|requirements-(tracking|person-detection)\.txt|samples/)' /tmp/zd_changed_files; then
              run_full=true
            fi
          fi
          git log -1 --format=%s 'HEAD^2' | grep -q '\[cctv-full\]' && run_full=true || true
          echo "run=$run_full" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/zd_changed_files ] && grep -Eq '^(app/face_photo_lab\.py|scripts/(install_sface|verify_face_photo_lab_local)\.py|static/face-lab\.html|tests/test_face_photo_lab\.py)' /tmp/zd_changed_files; then
            echo "face=true" >> "$GITHUB_OUTPUT"
          else
            echo "face=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Targeted full public-media run: $run_full"
      - name: Python compilation and isolated regression suite
        run: |
          python -m compileall -q app tests
          python -m pytest -q
      # Only rerun real 38MB SFace model inference when its owner changed.
      # On normal UI/map commits preserve the fast pure-API/browser tests.
      - name: Verify optional face models with genuine public-domain astronaut image
        if: steps.media_scope.outputs.face == 'true'
        env:
          ZD_FACE_LAB_ENABLE: '1'
        run: |
          python -m scripts.install_yunet
          python -m scripts.install_sface
          python -m scripts.verify_face_photo_lab_local
      # One targeted UI acceptance for the open P0 capture branch. Do not
      # launch the heavy Docker/Frigate suite for ordinary PRs.
      - name: Verify real-only landing and block synthetic data APIs
        if: contains(github.event.pull_request.head.ref, 'continuous-capture')
        run: python -m pytest -q tests/test_real_only_runtime.py
      - name: Publish real-only UI evidence when present
        if: always() && contains(github.event.pull_request.head.ref, 'continuous-capture')
        uses: actions/upload-artifact@v4
        with:
          name: p0-capture-browser-acceptance
          path: |
            reports/ui-smoke-result.json
            reports/ui-*.png
            reports/ui-server.log
            reports/verify-face-photo-lab-local.json
          if-no-files-found: warn
      # Restore a fixed, previously verified (GT-free) EPFL bundle on fast
      # UI-only PRs. Do not claim this as a new real-video inference result.
      # The hash/model/dataset contract is still enforced by the importer.
      - name: Restore EPFL candidate artifact from validated owner CI
        if: steps.media_scope.outputs.run != 'true'
        uses: actions/download-artifact@v4
        with:
          name: zd-p0-excel-demo-source
          run-id: 38515621715
          github-token: ${{ github.token }}
          path: .ci-restored-epfl
      - name: Verify restored research evidence is separate from runtime GT
        if: steps.media_scope.outputs.run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          unzip -p .ci-restored-epfl/zd-demo-local-source.zip \
            zd-demo/config/epfl6p_real_pair_candidates_v1.json \
            > config/epfl6p_real_pair_candidates_v1.json
          python - <<'PY'
          from app.epfl_review import _bundle, _extract
          raw=_bundle()
          assert raw is not None
          records=_extract(raw)
          assert len(records)==119, len(records)
          print('RESTORED_FROM_VALIDATED_OWNER_RUN=38515621715; pairs=119; NOT newly inferred')
          PY
      # Explicit, short opt-in: verify actual Edinburgh CAVIAR files, not mocks.
      # Does not repeat the heavyweight GB28181/Frigate Docker integration.
      - name: Install existing Roboflow tracking + pretrained person detector for real CCTV owner
        if: steps.media_scope.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'cctv-real')
        run: python -m pip install -r requirements-person-detection.txt
      - name: Validate real public CAVIAR two-camera media and existing ByteTrack
        if: steps.media_scope.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'cctv-real')
        run: |
          python -m pytest -q tests/test_cctv_dataset.py
          # SciPy exists only after optional tracking dependencies are installed.
          # Run negative-identity cases here rather than let importorskip hide them.
          python -m pytest -q -rs tests/test_epfl_six_person_geometry.py
          python -m scripts.verify_caviar_public_footage
          python -m scripts.assess_real_person_readiness --input reports/verify-caviar-fixed-cctv.json --output reports/real-person-identity-readiness.json
      # A/B candidate only: EPFL synchronized laboratory pair. Do not replace
      # accepted CAVIAR source until manual image review approves it.
      - name: Evaluate EPFL six-person official GT and real two-camera tracking
        if: steps.media_scope.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'cctv-real')
        run: python -m scripts.verify_epfl_six_person_ground_truth
      - name: Full browser EPFL real-video candidate import and audit closure
        if: steps.media_scope.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'cctv-real')
        run: python -m scripts.browser_epfl_six_person_review
      - name: Preserve real public CCTV evidence (no raw licensed videos)
        if: always() && steps.media_scope.outputs.run == 'true' && contains(github.event.pull_request.labels.*.name, 'cctv-real')
        uses: actions/upload-artifact@v4
        with:
          name: public-caviar-actual-video-proof
          path: |
            reports/verify-caviar-fixed-cctv.json
            reports/real-person-identity-readiness.json
            reports/caviar-*-gt.jpg
            reports/caviar-*-yolo.jpg
            reports/verify-epfl-alternative-cameras.json
            reports/verify-epfl-six-person-cross-camera.json
            reports/epfl6p-review-integration.json
            reports/ui-epfl-real-research-review.png
            reports/ui-excel-23-live-acceptance.png
            reports/epfl6p-paired-frame-*.jpg
            reports/epfl-lab-camera*-yolo-contact.jpg
            reports/epfl-lab-camera*-bytetrack-contiguous.jpg
          if-no-files-found: warn
      - name: Build auditable local demo ZIP
        run: python -m scripts.package_local_demo
      - name: Upload demo deliverable for Excel review
        uses: actions/upload-artifact@v4
        with:
          name: zd-p0-excel-demo-source
          path: dist/zd-demo-local-source.zip
          if-no-files-found: error

  real-media:
    # Opt-in PR label executes genuine licensed-video -> RTSP -> Frigate
    # -> SQLite -> /real acceptance. No mocked WVP control plane.
    if: >-
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'cctv-real')) ||
      (github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[gb-sip]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python and verify Docker
        run: |
          python -m pip install -r requirements.txt -r requirements-business.txt
          docker --version
          docker compose version
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Test backend with isolated SQLite
        run: python -m pytest -q
      - name: Verify real decoded face-box position against manual labels
        run: python -m scripts.verify_face_box_truth
      - name: Preserve annotated face-box verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annotated-face-box-truth
          path: reports/verify-face-box-truth.json
          if-no-files-found: warn
      - name: Test Haar face geometry and uncalibrated quality under real-video degradation
        run: python -m scripts.verify_face_degradation
      - name: Publish actual video degradation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-degradation-diagnostics
          path: reports/verify-face-degradation.json
          if-no-files-found: error
      - name: Chromium UI login and navigation smoke
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
          python -m scripts.browser_real_smoke
      - name: Publish UI acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-acceptance
          path: |
            reports/ui-smoke-result.json
            reports/ui-*.png
          if-no-files-found: warn
      - name: Package clean local demonstration
        run: python -m scripts.package_local_demo
      - name: Upload source-only demo package
        uses: actions/upload-artifact@v4
        with:
          name: zd-local-demo-source
          path: dist/zd-demo-local-source.zip
          if-no-files-found: error
      - name: Live CC0 pedestrian RTSP and Frigate integration
        run: bash scripts/ci_verify_frigate.sh
      - name: Publish evidence and verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-video-pipeline
          path: |
            reports/verify-live-frigate.json
            reports/verify-portal-live.json
            reports/motion-diagnostics.json
            reports/frigate-frame-*.jpg
          if-no-files-found: warn

  # Owner-scoped costly real protocol acceptance: explicit commit tag,
  # manual invocation, or a PR opt-in label. Routine UI PRs skip this job.
  gb-sip-protocol:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[gb-sip]')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'gb-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Independent upstream GB28181 SIP REGISTER and Catalog
        run: bash scripts/ci_verify_gb28181_sip.sh
      - name: Preserve actual SIP registration outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb28181-sip-actual-registration
          path: |
            reports/verify-gb28181-real-sip.json
            reports/verify-gb28181-real-app.json
            reports/gb28181-decoded-ci.jpg
          if-no-files-found: error
