name: ZD YOLO Actual Dual-Camera Frames (one-time)
on:
  push:
    branches:
      - agent/zd-yolo-frame-processor
    paths:
      - .github/workflows/zd-yolo-artifact.yml
permissions:
  actions: read
  contents: read
jobs:
  actual-yolo-frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: zd-final-excel-business-web-windows-with-real-video
          repository: yituanxing/test3
          run-id: 38666896417
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Install actual pre-trained person detector
        run: pip install --disable-pip-version-check ultralytics==8.3.228 opencv-python-headless numpy
      - name: Detect each sampled frame in both real cameras, export weights and frame JPEGs
        run: |
          unzip -q input/zd-demo-local-source.zip -d input/unpacked
          cat > /tmp/generate.py <<'PY'
          import cv2, hashlib, json, os
          from pathlib import Path
          from ultralytics import YOLO
          root=Path('input/unpacked')
          files=list(root.rglob('epfl-dual-60-98.mp4'))
          if len(files)!=1:raise RuntimeError('Expected exactly one shipped EPFL dual-camera research MP4; found '+str(files))
          video=files[0]
          print('Source',video,'bytes',video.stat().st_size,flush=True)
          model=YOLO('yolo11n.pt')
          weights=Path('yolo11n.pt')
          if not weights.is_file():raise RuntimeError('Missing real YOLO weights')
          out=Path('outputs/samples/demo-analysis')
          out.mkdir(parents=True,exist_ok=True)
          cap=cv2.VideoCapture(str(video))
          fps=cap.get(cv2.CAP_PROP_FPS);n=cap.get(cv2.CAP_PROP_FRAME_COUNT);w=cap.get(cv2.CAP_PROP_FRAME_WIDTH);h=cap.get(cv2.CAP_PROP_FRAME_HEIGHT)
          if not cap.isOpened() or w!=1280 or h!=512:raise RuntimeError('Unexpected source video')
          frames=[]
          for idx in range(19):
            t=float(idx*2)
            cap.set(cv2.CAP_PROP_POS_MSEC,t*1000)
            ok,combined=cap.read()
            if not ok:break
            row={'index':idx,'second':t}
            for name,img in [('A',combined[:,:640]),('B',combined[:,640:])]:
              pred=model.predict(source=img,classes=[0],conf=.25,imgsz=640,device='cpu',verbose=False)[0]
              boxes=[]
              for xyxy,score in zip(pred.boxes.xyxy.cpu().numpy(),pred.boxes.conf.cpu().numpy()):
                x1,y1,x2,y2=[int(round(float(x))) for x in xyxy]
                boxes.append({'x':max(0,x1),'y':max(0,y1),'w':max(1,x2-x1),'h':max(1,y2-y1),'score':round(float(score),4)})
              marked=img.copy()
              col=(48,210,95) if name=='A' else (50,174,253)
              for n,b in enumerate(boxes,1):
                x,y,bw,bh=b['x'],b['y'],b['w'],b['h']
                cv2.rectangle(marked,(x,y),(x+bw,y+bh),col,2)
                text=f'person {n}  {b["score"]:.2f}'
                cv2.rectangle(marked,(x,max(0,y-25)),(min(639,x+min(174,12*len(text))),y),col,-1)
                cv2.putText(marked,text,(x,max(15,y-7)),cv2.FONT_HERSHEY_SIMPLEX,.5,(0,0,0),1,cv2.LINE_AA)
              cv2.rectangle(marked,(0,0),(640,32),(15,30,49),-1)
              cv2.putText(marked,f'CAM {name} {t:05.2f}s  |  YOLO person: {len(boxes)}',(11,22),cv2.FONT_HERSHEY_SIMPLEX,.55,(255,255,255),1,cv2.LINE_AA)
              filename=f'{idx:03d}-{name}.jpg'
              cv2.imwrite(str(out/filename),marked,[int(cv2.IMWRITE_JPEG_QUALITY),85])
              row[name]={'image':filename,'boxes':boxes,'count':len(boxes),'width':640,'height':512}
            frames.append(row)
          cap.release()
          if not frames:raise RuntimeError('No samples decoded')
          result={'schema_version':'ZD_two_camera_processed_frames_v1',
           'model':'Ultralytics YOLO11n（真实逐帧推理，person类别）',
           'detector_mode':'yolo','is_real_inference':True,'data_kind':'two_camera_anonymous_person_boxes',
           'is_cross_camera_identity':False,'is_bytetrack':False,'composite_demo_clip':True,
           'input_cameras':{
             'A':{'width':640,'height':512,'fps':fps,'frames':n,'seconds':n/fps},
             'B':{'width':640,'height':512,'fps':fps,'frames':n,'seconds':n/fps}},
           'frame_sampling_interval_seconds':2.0,
           'processed_timepoints':len(frames),'processed_frames':2*len(frames),
           'total_person_boxes':sum(f['A']['count']+f['B']['count'] for f in frames),
           'frames':frames,'caution':'逐帧人体框来自实际 YOLO11n 模型推理；每帧内的序号不是跟踪ID。两机是同步研究素材，不等于真人身份识别。'}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('outputs/models').mkdir(parents=True,exist_ok=True)
          import shutil
          shutil.copy2(weights,'outputs/models/yolo11n.pt')
          proof={'model':'yolo11n.pt','weights_sha256':hashlib.sha256(weights.read_bytes()).hexdigest(),
           'input_video_sha256':hashlib.sha256(video.read_bytes()).hexdigest(),
           'processed_frames':2*len(frames),'person_boxes':result['total_person_boxes'],
           'source_license':'EPFL CVLab research footage; respect use restrictions',
           'model_license':'Ultralytics YOLO11n AGPL-3.0/Enterprise, check obligations for distribution'}
          Path('outputs/proof.json').write_text(json.dumps(proof,indent=2))
          print('REAL_YOLO_PERSON_FRAMES',json.dumps(proof),flush=True)
          PY
          python /tmp/generate.py
      - uses: actions/upload-artifact@v4
        with:
          name: zd-actual-yolo-two-camera-boxed-frames-and-model
          path: outputs/
          retention-days: 2
