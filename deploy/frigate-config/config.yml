mqtt:
  enabled: false

detectors:
  cpu1:
    type: cpu
    num_threads: 2

face_recognition:
  enabled: false

objects:
  track:
    - person

# CI diagnostic profile: allow modest motion to trigger the normal
# Frigate object detector. Not a permissive person confidence threshold.
motion:
  enabled: true
  threshold: 10
  contour_area: 5

record:
  enabled: false

snapshots:
  enabled: false

cameras:
  demo:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://mediamtx:8554/demo
          roles:
            - detect
    detect:
      enabled: true
      width: 960
      height: 540
      fps: 5
