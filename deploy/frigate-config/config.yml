mqtt:
  enabled: false

# Explicitly enable inference at both global and camera scopes.
detect:
  enabled: true

detectors:
  cpu1:
    type: cpu
    num_threads: 2

face_recognition:
  enabled: false

objects:
  track:
    - person

# CI diagnostic profile: allow modest motion to trigger the normal
# Frigate object detector. Not a permissive person confidence threshold.
motion:
  enabled: true
  threshold: 10
  contour_area: 5
  # CI-only: do not suppress large real motion as a lightning scene change.
  lightning_threshold: 1.0

record:
  enabled: false

# Persist a limited test snapshot so tracked objects remain queryable via
# /api/events even when continuous recording is disabled.
snapshots:
  enabled: true
  retain:
    default: 1

cameras:
  demo:
    enabled: true
    ffmpeg:
      inputs:
        # Isolated upstream test from Frigate's official dummy-camera guide.
        # Bypass RTSP temporarily to diagnose its zero inference rate.
        - path: /media/frigate/pedestrian.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
    detect:
      enabled: true
      width: 960
      height: 540
      fps: 5
