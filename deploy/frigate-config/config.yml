mqtt:
  enabled: false

# Explicitly enable inference at both global and camera scopes.
detect:
  enabled: true

# Prefer Frigate's bundled, verified OpenVINO IR model on the CPU.
# This avoids external model downloads and isolates the previous TFLite path.
detectors:
  ov_cpu:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

face_recognition:
  enabled: false

objects:
  track:
    - person

# CI diagnostic profile: allow modest motion to trigger the normal
# Frigate object detector. Not a permissive person confidence threshold.
motion:
  enabled: true
  threshold: 10
  contour_area: 5
  # CI-only: do not suppress large real motion as a lightning scene change.
  lightning_threshold: 1.0

record:
  enabled: false

# Persist a limited test snapshot so tracked objects remain queryable via
# /api/events even when continuous recording is disabled.
snapshots:
  enabled: true
  retain:
    default: 1

cameras:
  demo:
    enabled: true
    ffmpeg:
      inputs:
        # Production-shaped verification: decoded through MediaMTX RTSP.
        # The previous local-file OpenVINO control test is separately certified.
        - path: rtsp://mediamtx:8554/demo
          input_args: preset-rtsp-generic
          roles:
            - detect
    detect:
      enabled: true
      width: 960
      height: 540
      fps: 5
