services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"
    depends_on:
      - mediamtx
    ports:
      # The Frigate port 5000 is UNAUTHENTICATED: bind loopback only.
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8971:8971"
    volumes:
      - ./frigate-config:/config
      - ../.ci-data/pedestrian.mp4:/media/frigate/pedestrian.mp4:ro
      - ./frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
